<router-outlet />

<div class="pointer-events-none fixed inset-x-0 bottom-4 z-[100] flex flex-col items-center gap-2 px-4 sm:bottom-auto sm:top-4 sm:items-end">
  @for (toast of toasts.toasts(); track toast.id) {
    <button
      type="button"
      class="pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-xl border px-4 py-3 text-left text-sm shadow-xl backdrop-blur-sm animate-rise"
      [class]="
        toast.type === 'success'
          ? 'border-blue-200 bg-blue-50/95 text-blue-900 shadow-blue-500/10'
          : toast.type === 'error'
            ? 'border-rose-200 bg-rose-50/95 text-rose-900 shadow-rose-500/10'
            : 'border-sky-200 bg-sky-50/95 text-sky-900 shadow-sky-500/10'
      "
      (click)="toasts.dismiss(toast.id)"
    >
      <span class="text-base leading-5">
        {{ toast.type === 'success' ? '✓' : toast.type === 'error' ? '!' : 'i' }}
      </span>
      <span class="flex-1 font-medium">{{ toast.message }}</span>
    </button>
  }
</div>
